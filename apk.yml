name: Compiler l'APK

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      # Capacitor 6 demande le JDK 17
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Installer Capacitor
        run: npm install

      - name: Créer le projet Android
        run: |
          npx cap add android
          npx cap sync android

      - name: Plein écran + orientation paysage
        run: |
          sed -i 's|<activity|<activity android:screenOrientation="sensorLandscape"|' android/app/src/main/AndroidManifest.xml
          sed -i 's|<style name="AppTheme.NoActionBar" parent="Theme.AppCompat.DayNight.NoActionBar">|&\n        <item name="android:windowFullscreen">true</item>\n        <item name="android:windowLayoutInDisplayCutoutMode">shortEdges</item>|' android/app/src/main/res/values/styles.xml

      - name: Compiler l'APK
        working-directory: android
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug

      - uses: actions/upload-artifact@v4
        with:
          name: aube-de-brumevert-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
